name: Testes e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: phamani-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, bcmath, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Dependências
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build do front (gera Wayfinder e o manifest do Vite)
        run: npm run build

      - name: Testes
        run: php artisan test

  deploy:
    name: Deploy no marvin
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, phamani]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: ./deploy/deploy.sh
        env:
          PHAMANI_ENV_FILE: /home/pholaroid/apps/phamani/.env.production
