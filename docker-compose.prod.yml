# Produção do Phamani (servidor "marvin").
# Use sempre pelo deploy/deploy.sh, que passa o arquivo de ambiente:
#   docker compose -p phamani -f docker-compose.prod.yml --env-file /home/pholaroid/apps/phamani/.env.production ...
#
# Nada fica exposto na rede: o acesso público é pelo Cloudflare Tunnel (container "cloudflared").
# O nginx fica em 127.0.0.1:8686 só para teste local no próprio servidor (curl).

name: phamani

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    target: app
  image: phamani-app:latest
  env_file:
    - ${PHAMANI_ENV_FILE:-.env.production}
  environment:
    TZ: ${APP_TIMEZONE:-America/Manaus}
  volumes:
    - storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - phamani

services:
  app:
    <<: *app
    container_name: phamani_app
    mem_limit: 384m

  # Recorrências, débito automático e saldo: php artisan schedule:work
  scheduler:
    <<: *app
    container_name: phamani_scheduler
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 192m

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: web
    image: phamani-web:latest
    container_name: phamani_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8686}:8000"
    depends_on:
      - app
    mem_limit: 64m
    networks:
      - phamani

  postgres:
    image: postgres:17-alpine
    container_name: phamani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-phamani}
      POSTGRES_USER: ${DB_USERNAME:-phamani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env.production}
      TZ: ${APP_TIMEZONE:-America/Manaus}
    # Só no localhost do marvin: acesso pelo DBeaver via túnel SSH (nunca exposto na rede).
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    networks:
      - phamani

  # Backup diário do banco (pg_dump comprimido), mantém os últimos 30 dias.
  backup:
    image: postgres:17-alpine
    container_name: phamani_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-phamani}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-phamani}
      TZ: ${APP_TIMEZONE:-America/Manaus}
    volumes:
      - ${BACKUP_DIR:-/media/dados/backups/phamani}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/phamani-$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump --no-owner --no-privileges | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.tmp"; echo "backup FALHOU" >&2
          fi
          find /backups -name 'phamani-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    networks:
      - phamani

  # Acesso público via Cloudflare Tunnel (sem abrir portas no roteador).
  # O hostname phamani.lukisa.com.br → http://web:8000 é configurado no painel da Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: phamani_cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no .env.production}
    depends_on:
      - web
    mem_limit: 64m
    networks:
      - phamani

volumes:
  pgdata:
  storage:

networks:
  phamani:
