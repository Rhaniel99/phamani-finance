[PHP]
memory_limit = 256M
; extrato do cartão em PDF: o do app do Bradesco é uma imagem grande (~60 MB)
post_max_size = 110M
upload_max_filesize = 100M
max_file_uploads = 20
max_execution_time = 60
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; produção: o código só muda com um novo deploy (nova imagem)
opcache.validate_timestamps = 0
