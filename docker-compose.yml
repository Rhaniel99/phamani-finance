name: phamani

x-app: &app
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: phamani-app:dev
  volumes:
    - ./:/var/www/html
  working_dir: /var/www/html
  networks:
    - phamani

services:
  app:
    <<: *app
    container_name: phamani_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: phamani_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8686}:8000"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - phamani

  # Vite (HMR) — roda na mesma imagem do PHP por causa do Wayfinder.
  vite:
    <<: *app
    container_name: phamani_vite
    profiles: ["dev"]
    command: ["npm", "run", "dev"]
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_PORT: ${VITE_PORT:-5174}
    ports:
      - "${VITE_PORT:-5174}:5173"

  postgres:
    image: postgres:17-alpine
    container_name: phamani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-phamani}
      POSTGRES_USER: ${DB_USERNAME:-phamani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - phamani

networks:
  phamani:
    driver: bridge

volumes:
  pgdata:
